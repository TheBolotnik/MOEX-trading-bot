[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-trading-bot"
version = "0.1.0"
description = "MOEX trading signal bot (Dynamic Swing Momentum) — skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MOEX Trading Bot contributors" }]
dependencies = [
  "tinkoff-investments>=0.2.0b80",
  "pandas>=2.0",
  "numpy>=1.26",
  "SQLAlchemy>=2.0",
  "aiogram>=3.4",
  "smartmoneyconcepts>=0.0.26",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
moex-bot = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
